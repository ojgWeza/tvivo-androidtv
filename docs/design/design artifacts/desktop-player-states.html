<div id="tvivo-desktop-prototype">
  <style>
    #tvivo-desktop-prototype { --tv-bg:#0A1619; --tv-surface:#0F2126; --tv-elevated:#163036; --tv-line:#1E4149; --tv-ink:#E8F1F2; --tv-dim:#93ACB1; --tv-accent:#D97757; --tv-on-accent:#1A0A05; color:var(--tv-ink); font-family:Arial, sans-serif; }
    #tvivo-desktop-prototype * { box-sizing:border-box; }
    #tvivo-desktop-prototype .switcher { display:flex; gap:8px; flex-wrap:wrap; margin:0 0 14px; }
    #tvivo-desktop-prototype button { appearance:none; border:1px solid var(--tv-line); background:var(--tv-surface); color:var(--tv-ink); min-height:34px; padding:7px 11px; cursor:pointer; font:inherit; font-size:12px; }
    #tvivo-desktop-prototype button:hover { background:var(--tv-elevated); }
    #tvivo-desktop-prototype button:focus-visible { outline:2px solid var(--tv-accent); outline-offset:2px; }
    #tvivo-desktop-prototype button[aria-pressed="true"] { background:var(--tv-accent); border-color:var(--tv-accent); color:var(--tv-on-accent); }
    #tvivo-desktop-prototype .window { width:100%; min-height:520px; background:var(--tv-bg); border:1px solid var(--tv-line); display:grid; grid-template-rows:50px minmax(330px, 1fr) 76px; overflow:hidden; }
    #tvivo-desktop-prototype .top { background:var(--tv-surface); border-bottom:1px solid var(--tv-line); display:flex; align-items:center; justify-content:space-between; padding:0 20px; gap:16px; }
    #tvivo-desktop-prototype .brand { display:flex; align-items:center; gap:8px; font-size:18px; font-weight:700; letter-spacing:-.02em; white-space:nowrap; }
    #tvivo-desktop-prototype .brand img { width:30px; height:30px; }
    #tvivo-desktop-prototype .brand small { color:var(--tv-dim); font-size:12px; font-weight:400; letter-spacing:0; }
    #tvivo-desktop-prototype .fixture { min-width:0; display:flex; align-items:center; justify-content:flex-end; gap:9px; font-size:12px; color:var(--tv-dim); }
    #tvivo-desktop-prototype .fixture strong { color:var(--tv-ink); font-weight:500; max-width:300px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    #tvivo-desktop-prototype .state-dot { width:7px; height:7px; background:var(--tv-accent); display:inline-block; }
    #tvivo-desktop-prototype .viewport { min-height:330px; display:grid; place-items:center; padding:26px; background:var(--tv-bg); }
    #tvivo-desktop-prototype .frame { width:min(78%, 690px); aspect-ratio:16/9; background:#050A0C; border:1px solid #23434A; display:grid; place-items:center; position:relative; }
    #tvivo-desktop-prototype .frame::before, #tvivo-desktop-prototype .frame::after { content:""; position:absolute; background:#10272C; }
    #tvivo-desktop-prototype .frame::before { width:1px; height:100%; left:50%; }
    #tvivo-desktop-prototype .frame::after { height:1px; width:100%; top:50%; }
    #tvivo-desktop-prototype .video-label { position:relative; z-index:1; text-align:center; color:var(--tv-dim); font-size:12px; letter-spacing:.06em; }
    #tvivo-desktop-prototype .video-label b { display:block; margin-top:8px; color:var(--tv-ink); font-size:14px; letter-spacing:0; font-weight:500; }
    #tvivo-desktop-prototype .dock { background:var(--tv-elevated); border-top:1px solid var(--tv-line); display:grid; grid-template-columns:auto auto auto minmax(170px,1fr) auto; align-items:center; gap:10px; padding:12px 16px; }
    #tvivo-desktop-prototype .dock .primary { background:var(--tv-accent); border-color:var(--tv-accent); color:var(--tv-on-accent); }
    #tvivo-desktop-prototype .timeline { display:grid; grid-template-columns:36px 1fr 36px; align-items:center; gap:8px; color:var(--tv-dim); font-size:11px; }
    #tvivo-desktop-prototype input[type=range] { width:100%; accent-color:var(--tv-accent); }
    #tvivo-desktop-prototype .full { background:var(--tv-bg); }
    #tvivo-desktop-prototype .full .window { min-height:520px; grid-template-rows:minmax(0,1fr); border:0; position:relative; }
    #tvivo-desktop-prototype .full .viewport { padding:0; min-height:520px; }
    #tvivo-desktop-prototype .full .frame { width:100%; max-width:none; height:100%; aspect-ratio:auto; border:0; }
    #tvivo-desktop-prototype .full .top, #tvivo-desktop-prototype .full .dock { display:none; }
    #tvivo-desktop-prototype .full .chrome { position:absolute; inset:0; pointer-events:none; display:flex; flex-direction:column; justify-content:space-between; }
    #tvivo-desktop-prototype .full .chrome > * { pointer-events:auto; }
    #tvivo-desktop-prototype .full .full-top { background:var(--tv-surface); border-bottom:1px solid var(--tv-line); display:flex; justify-content:space-between; align-items:center; padding:12px 18px; font-size:12px; }
    #tvivo-desktop-prototype .full .full-dock { background:var(--tv-elevated); border-top:1px solid var(--tv-line); display:grid; grid-template-columns:auto auto minmax(160px,1fr) auto; gap:10px; align-items:center; padding:12px 16px; }
    #tvivo-desktop-prototype .full.hidden .chrome { display:none; }
    #tvivo-desktop-prototype .full.hidden .frame { background:#050A0C; }
    #tvivo-desktop-prototype .caption { color:var(--tv-dim); font-size:12px; margin-top:10px; }
    @media (max-width:600px) { #tvivo-desktop-prototype .window { grid-template-rows:58px minmax(250px,1fr) auto; } #tvivo-desktop-prototype .top { padding:0 12px; } #tvivo-desktop-prototype .fixture strong { max-width:145px; } #tvivo-desktop-prototype .viewport { padding:16px; min-height:250px; } #tvivo-desktop-prototype .frame { width:100%; } #tvivo-desktop-prototype .dock { grid-template-columns:repeat(3,auto); } #tvivo-desktop-prototype .timeline { grid-column:1 / -1; } #tvivo-desktop-prototype .full .window, #tvivo-desktop-prototype .full .viewport { min-height:360px; } }
  </style>
  <div class="switcher" role="group" aria-label="Player preview state">
    <button type="button" data-mode="ready" aria-pressed="true">Windowed · ready</button>
    <button type="button" data-mode="playing" aria-pressed="false">Windowed · playing</button>
    <button type="button" data-mode="full" aria-pressed="false">Full screen · controls</button>
    <button type="button" data-mode="hidden" aria-pressed="false">Full screen · picture only</button>
  </div>
  <div class="stage">
    <section class="window" aria-label="Tvivo desktop player preview">
      <header class="top"><div class="brand"><img src="img/icon.svg" alt="Tvivo"><span>Tvivo</span><small>desktop</small></div><div class="fixture"><span class="state-dot" aria-hidden="true"></span><strong>synthetic-feature.mp4</strong><span data-state>Ready</span></div></header>
      <main class="viewport"><div class="frame"><div class="video-label">16:9 FITTED VIEWPORT<b data-centre>Choose a local fixture</b></div></div></main>
      <footer class="dock"><button type="button">Open fixture</button><button type="button" class="primary" data-primary>Play</button><button type="button">Stop</button><label class="timeline"><span>00:00</span><input type="range" min="0" max="100" value="0" aria-label="Playback position"><span data-duration>00:00</span></label><button type="button">Full screen</button></footer>
      <div class="chrome"><header class="full-top"><span><strong>Tvivo</strong> · synthetic-feature.mp4</span><span data-state>Playing</span></header><footer class="full-dock"><button type="button" class="primary">Pause</button><button type="button">Stop</button><label class="timeline"><span>01:18</span><input type="range" min="0" max="100" value="39" aria-label="Playback position"><span>03:20</span></label><button type="button">Exit full screen</button></footer></div>
    </section>
  </div>
  <div class="caption" data-caption>Persistent windowed dock. The native video surface occupies only the centre region.</div>
  <script>
    (() => {
      const root = document.getElementById('tvivo-desktop-prototype');
      const shell = root.querySelector('.window');
      const buttons = root.querySelectorAll('[data-mode]');
      const state = root.querySelectorAll('[data-state]');
      const centre = root.querySelector('[data-centre]');
      const primary = root.querySelector('[data-primary]');
      const duration = root.querySelector('[data-duration]');
      const caption = root.querySelector('[data-caption]');
      const render = mode => {
        const fullscreen = mode === 'full' || mode === 'hidden';
        shell.parentElement.classList.toggle('full', fullscreen);
        shell.parentElement.classList.toggle('hidden', mode === 'hidden');
        buttons.forEach(button => button.setAttribute('aria-pressed', String(button.dataset.mode === mode)));
        const playing = mode !== 'ready';
        state.forEach(node => node.textContent = playing ? 'Playing' : 'Ready');
        centre.textContent = playing ? 'Local synthetic fixture · 16:9 fit' : 'Choose a local fixture';
        primary.textContent = playing ? 'Pause' : 'Play';
        duration.textContent = playing ? '03:20' : '00:00';
        caption.textContent = mode === 'ready' ? 'Persistent windowed dock. The native video surface occupies only the centre region.' : mode === 'playing' ? 'Transport remains outside the viewport, so Compose never competes with the AWT video surface.' : mode === 'full' ? 'Opaque control bands replace overlays while controls are visible.' : 'After 2.5 seconds of inactivity, only the fitted picture remains.';
      };
      buttons.forEach(button => button.addEventListener('click', () => render(button.dataset.mode)));
    })();
  </script>
</div>
