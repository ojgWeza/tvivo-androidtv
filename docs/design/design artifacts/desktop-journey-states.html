<div id="tvivo-desktop-journey">
  <style>
    #tvivo-desktop-journey { --v-bg:#0A1619; --v-surface:#0F2126; --v-elevated:#163036; --v-line:#1E4149; --v-ink:#E8F1F2; --v-dim:#93ACB1; --v-accent:#D97757; --v-on:#1A0A05; color:var(--v-ink); font-family:Arial,sans-serif; }
    #tvivo-desktop-journey * { box-sizing:border-box; }
    #tvivo-desktop-journey button, #tvivo-desktop-journey input { font:inherit; }
    #tvivo-desktop-journey .modes { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
    #tvivo-desktop-journey button { color:var(--v-ink); background:var(--v-surface); border:1px solid var(--v-line); min-height:34px; padding:7px 11px; cursor:pointer; font-size:12px; }
    #tvivo-desktop-journey button:hover { background:var(--v-elevated); }
    #tvivo-desktop-journey button:focus-visible, #tvivo-desktop-journey input:focus-visible { outline:2px solid var(--v-accent); outline-offset:2px; }
    #tvivo-desktop-journey button[aria-pressed=true], #tvivo-desktop-journey .primary { background:var(--v-accent); border-color:var(--v-accent); color:var(--v-on); }
    #tvivo-desktop-journey .app { min-height:520px; background:var(--v-bg); border:1px solid var(--v-line); overflow:hidden; }
    #tvivo-desktop-journey .topbar { height:54px; display:flex; align-items:center; gap:22px; padding:0 20px; border-bottom:1px solid var(--v-line); background:var(--v-surface); }
    #tvivo-desktop-journey .wordmark { display:flex; align-items:center; gap:8px; font-size:19px; font-weight:700; letter-spacing:-.02em; white-space:nowrap; }
    #tvivo-desktop-journey .wordmark img { width:30px; height:30px; }
    #tvivo-desktop-journey .topnav { display:flex; align-items:center; gap:4px; height:100%; }
    #tvivo-desktop-journey .topnav button { border:0; height:100%; background:transparent; padding:0 10px; color:var(--v-dim); }
    #tvivo-desktop-journey .topnav button.active { color:var(--v-ink); box-shadow:inset 0 -2px 0 var(--v-accent); }
    #tvivo-desktop-journey .account { margin-left:auto; color:var(--v-dim); font-size:12px; }
    #tvivo-desktop-journey .screen { display:none; min-height:465px; }
    #tvivo-desktop-journey .screen.visible { display:flex; }
    #tvivo-desktop-journey .login { align-items:center; justify-content:center; padding:30px; }
    #tvivo-desktop-journey .login-box { width:min(100%, 510px); }
    #tvivo-desktop-journey h1 { margin:0; font-weight:500; font-size:27px; letter-spacing:-.025em; }
    #tvivo-desktop-journey .sub { margin:8px 0 28px; color:var(--v-dim); font-size:14px; }
    #tvivo-desktop-journey .fields { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    #tvivo-desktop-journey label { display:grid; gap:6px; color:var(--v-dim); font-size:11px; }
    #tvivo-desktop-journey label.server { grid-column:1/-1; }
    #tvivo-desktop-journey input { width:100%; min-height:40px; color:var(--v-ink); background:var(--v-elevated); border:1px solid var(--v-line); padding:0 10px; }
    #tvivo-desktop-journey .actions { display:flex; gap:10px; margin-top:24px; }
    #tvivo-desktop-journey .hint { margin-top:20px; color:var(--v-dim); font-size:12px; }
    #tvivo-desktop-journey .home { flex-direction:column; padding:42px; }
    #tvivo-desktop-journey .home-header { display:flex; align-items:baseline; justify-content:space-between; gap:14px; }
    #tvivo-desktop-journey .home-header p { margin:0; color:var(--v-dim); font-size:13px; }
    #tvivo-desktop-journey .choices { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-top:32px; }
    #tvivo-desktop-journey .choice { min-height:228px; display:flex; flex-direction:column; justify-content:flex-end; padding:20px; text-align:left; background:var(--v-elevated); border:1px solid var(--v-line); }
    #tvivo-desktop-journey .choice span { font-size:21px; font-weight:500; }
    #tvivo-desktop-journey .choice small { margin-top:7px; color:var(--v-dim); font-size:12px; }
    #tvivo-desktop-journey .choice:hover, #tvivo-desktop-journey .choice:focus-visible { border-color:var(--v-accent); background:#1B383E; }
    #tvivo-desktop-journey .browse { min-height:465px; display:grid; grid-template-columns:220px 1fr; }
    #tvivo-desktop-journey .rail { background:var(--v-surface); border-right:1px solid var(--v-line); padding:16px 12px; }
    #tvivo-desktop-journey .rail input { margin-bottom:12px; min-height:35px; font-size:12px; }
    #tvivo-desktop-journey .rail button { display:block; width:100%; text-align:left; border:0; padding:10px; color:var(--v-dim); }
    #tvivo-desktop-journey .rail button.selected { background:var(--v-accent); color:var(--v-on); }
    #tvivo-desktop-journey .content { padding:22px; min-width:0; }
    #tvivo-desktop-journey .content-head { display:flex; align-items:center; gap:14px; margin-bottom:18px; }
    #tvivo-desktop-journey .content-head h1 { font-size:22px; }
    #tvivo-desktop-journey .content-head input { margin-left:auto; max-width:250px; min-height:36px; font-size:12px; }
    #tvivo-desktop-journey .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(98px,1fr)); gap:12px; }
    #tvivo-desktop-journey .item { min-height:150px; background:var(--v-elevated); border:1px solid var(--v-line); display:flex; flex-direction:column; justify-content:flex-end; padding:10px; text-align:left; }
    #tvivo-desktop-journey .item:hover, #tvivo-desktop-journey .item:focus-visible { border:2px solid var(--v-accent); padding:9px; }
    #tvivo-desktop-journey .item strong { font-size:13px; font-weight:500; }
    #tvivo-desktop-journey .item small { margin-top:4px; color:var(--v-dim); font-size:11px; }
    #tvivo-desktop-journey .note { color:var(--v-dim); font-size:12px; margin-top:10px; }
    @media(max-width:620px) { #tvivo-desktop-journey .topbar { gap:10px; padding:0 12px; } #tvivo-desktop-journey .topnav button { padding:0 6px; } #tvivo-desktop-journey .account { display:none; } #tvivo-desktop-journey .choices { grid-template-columns:1fr; } #tvivo-desktop-journey .choice { min-height:100px; } #tvivo-desktop-journey .browse { grid-template-columns:1fr; } #tvivo-desktop-journey .rail { border-right:0; border-bottom:1px solid var(--v-line); display:flex; gap:5px; overflow:auto; } #tvivo-desktop-journey .rail input { min-width:130px; margin:0; } #tvivo-desktop-journey .rail button { min-width:max-content; } #tvivo-desktop-journey .grid { grid-template-columns:repeat(3,1fr); } #tvivo-desktop-journey .content-head { flex-wrap:wrap; } #tvivo-desktop-journey .content-head input { margin-left:0; max-width:none; flex:1 1 100%; } }
  </style>
  <div class="modes" role="group" aria-label="Desktop screen preview"><button type="button" data-view="login" aria-pressed="true">Sign in</button><button type="button" data-view="home" aria-pressed="false">Library home</button><button type="button" data-view="browse" aria-pressed="false">Browse movies</button></div>
  <section class="app" aria-label="Tvivo desktop application preview">
    <header class="topbar"><span class="wordmark"><img src="img/icon.svg" alt=""><span>Tvivo</span></span><nav class="topnav" aria-label="Library"><button type="button" class="active">Home</button><button type="button">Movies</button><button type="button">Series</button><button type="button">Live TV</button></nav><span class="account">Account</span></header>
    <main class="screen login visible"><div class="login-box"><h1>Sign in to your provider</h1><p class="sub">Your connection stays on this device.</p><div class="fields"><label class="server">Server<input aria-label="Server" placeholder="server.example:8080"></label><label>Username<input aria-label="Username" placeholder="Username"></label><label>Password<input aria-label="Password" type="password" placeholder="Password"></label></div><div class="actions"><button type="button" class="primary">Sign in</button><button type="button">Show password</button></div><p class="hint">Use the server address, username, and password supplied by your provider.</p></div></main>
    <main class="screen home"><div class="home-header"><div><h1>Your library</h1><p>Choose what you want to watch.</p></div><button type="button">Refresh library</button></div><div class="choices"><button type="button" class="choice"><span>Live TV</span><small>Channels and live events</small></button><button type="button" class="choice"><span>Movies</span><small>Browse films by category</small></button><button type="button" class="choice"><span>Series</span><small>Choose a series, season, and episode</small></button></div></main>
    <main class="screen browse"><aside class="rail"><input aria-label="Filter categories" placeholder="Filter categories"><button type="button" class="selected">All movies</button><button type="button">Recently added</button><button type="button">Continue watching</button><button type="button">Favourites</button><button type="button">Action</button><button type="button">Drama</button></aside><section class="content"><div class="content-head"><h1>All movies</h1><input aria-label="Search movies" placeholder="Search movies"></div><div class="grid"><button type="button" class="item"><strong>Featured film</strong><small>Movie · HD</small></button><button type="button" class="item"><strong>Midnight story</strong><small>Movie · HD</small></button><button type="button" class="item"><strong>Open road</strong><small>Movie · SD</small></button><button type="button" class="item"><strong>Last signal</strong><small>Movie · HD</small></button><button type="button" class="item"><strong>Summer house</strong><small>Movie · HD</small></button><button type="button" class="item"><strong>Northbound</strong><small>Movie · SD</small></button><button type="button" class="item"><strong>Paper moon</strong><small>Movie · HD</small></button><button type="button" class="item"><strong>Under current</strong><small>Movie · HD</small></button><button type="button" class="item"><strong>After rain</strong><small>Movie · HD</small></button><button type="button" class="item"><strong>Far light</strong><small>Movie · SD</small></button></div></section></main>
  </section>
  <div class="note" data-note>Desktop sign-in is compact and keyboard-first, rather than a scaled Android TV form.</div>
  <script>
    (() => { const root=document.getElementById('tvivo-desktop-journey'); const notes={login:'Desktop sign-in is compact and keyboard-first, rather than a scaled Android TV form.',home:'The home screen makes content type explicit before search or browse begins.',browse:'Browse keeps categories, search, and a responsive desktop grid visible together.'}; root.querySelectorAll('[data-view]').forEach(button=>button.addEventListener('click',()=>{const view=button.dataset.view;root.querySelectorAll('[data-view]').forEach(x=>x.setAttribute('aria-pressed',String(x===button)));root.querySelectorAll('.screen').forEach(x=>x.classList.toggle('visible',x.classList.contains(view)));root.querySelector('[data-note]').textContent=notes[view];})); })();
  </script>
</div>
