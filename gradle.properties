# Capped deliberately: the Gradle daemon and the Kotlin compile daemon are separate
# JVMs that persist between builds, and at defaults they held ~2.5 GB between them.
# This project is small enough that these limits cost nothing in build time.
org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx768m
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
